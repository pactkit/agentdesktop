name: Release validation

on:
  push:
    branches: [release, "integration/**", "fix/**", "feature/**"]
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  core:
    name: Core and agent tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98"
          components: rustfmt,clippy
      - run: cargo test --locked -p agentdesktop-core -p agentdesktop-proto -p agentdesktop-agent --lib

  controller:
    name: Controller and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98"
          components: rustfmt,clippy
      - name: Build both frontends
        working-directory: frontend
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm build
      - name: Migration smoke tests when present
        run: |
          if test -f scripts/test_legacy_migrations.py; then
            python3 scripts/test_legacy_migrations.py
          fi
      - run: cargo test --locked -p agentdesktop-controller
      - run: cargo fmt --all --check
      - run: |
          make generate-schema
          git diff --exit-code -- schema
